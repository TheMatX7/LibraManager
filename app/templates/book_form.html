{% extends 'base.html' %}{% block title %}{{ 'Edycja książki' if book else 'Nowa książka' }} · LibraManager{% endblock %}{% block content %}<div class="page-heading compact-heading"><div><span class="eyebrow">KATALOG</span><h1>{{ 'Edytuj książkę' if book else 'Dodaj książkę' }}</h1><p>Utwórz lub zaktualizuj pozycję katalogową i przypisz autorów.</p></div></div><form method="post" class="panel form-grid book-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="wide">Tytuł<input name="title" required maxlength="200" value="{{ book.title if book else '' }}"></label><label>ISBN<input name="isbn" maxlength="20" value="{{ book.isbn if book and book.isbn else '' }}"></label><label>Rok wydania<input name="publication_year" inputmode="numeric" value="{{ book.publication_year if book and book.publication_year else '' }}"></label><label>Wydawca<input name="publisher" maxlength="150" value="{{ book.publisher if book and book.publisher else '' }}"></label><label>Kategoria<select name="category_id"><option value="">— bez kategorii —</option>{% for category in categories %}<option value="{{ category.id }}" {% if book and book.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label class="wide">Autorzy<select name="author_ids" multiple size="7">{% for author in authors %}<option value="{{ author.id }}" {% if book and author in book.authors %}selected{% endif %}>{{ author.last_name }} {{ author.first_name }}</option>{% endfor %}</select><small>Przytrzymaj Ctrl, aby wybrać wielu autorów.</small></label><label class="wide">Opis<textarea name="description" rows="5">{{ book.description if book and book.description else '' }}</textarea></label><div class="form-actions wide"><a class="button secondary" href="{{ url_for('web.catalog') }}">Anuluj</a><button class="button primary" type="submit">{{ 'Zapisz zmiany' if book else 'Dodaj do katalogu' }}</button></div></form>{% endblock %}
